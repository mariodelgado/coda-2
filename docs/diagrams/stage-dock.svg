<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#eef2f0"/>
  <text x="36" y="36" font-size="11" fill="#1a1a1a" letter-spacing="0.28em" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">PLATE 04  ·  STAGE VS DOCK</text>
  <text x="36" y="56" font-size="9" fill="#4a5560" letter-spacing="0.12em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">PHYSICS IN THE VISUAL FIELD  ·  AGENCY IN THE LEDGER</text>

  <!-- instrument chrome outline -->
  <rect x="60" y="80" width="640" height="300" rx="8" fill="#c5d5d8" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- stage 65% -->
  <rect x="70" y="90" width="620" height="178" rx="4" fill="#5a8fb5" fill-opacity="0.28"/>
  <text x="90" y="118" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.2em">STAGE  ·  ~65%</text>
  <text x="90" y="138" font-size="9" fill="#4a5560">physics · continuous state</text>

  <!-- drift | device tabs -->
  <rect x="90" y="156" width="52" height="22" rx="11" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="116" y="171" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">drift</text>
  <rect x="150" y="156" width="58" height="22" rx="11" fill="#1a1a1a"/>
  <text x="179" y="171" text-anchor="middle" font-size="8" font-weight="600" fill="#f7faf9">device</text>

  <!-- stylized landscape / cryo hint -->
  <ellipse cx="380" cy="220" rx="160" ry="36" fill="#7a8a4a" fill-opacity="0.25"/>
  <circle cx="340" cy="210" r="18" fill="#3d6a8c" fill-opacity="0.7"/>
  <circle cx="420" cy="214" r="14" fill="#7a8a4a" fill-opacity="0.7"/>
  <circle cx="348" cy="206" r="3.5" fill="#c41e1e"/>
  <circle cx="428" cy="210" r="3.5" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="560" y="200" font-size="8" fill="#4a5560">true / applied</text>
  <text x="560" y="216" font-size="8" fill="#4a5560">mK · readiness</text>

  <!-- dock 35% with progressive blur hint -->
  <defs>
    <linearGradient id="blurGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf9" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#f7faf9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f7faf9" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="70" y="268" width="620" height="102" rx="4" fill="url(#blurGrad)" stroke="#1a1a1a" stroke-width="1"/>
  <text x="90" y="296" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.2em">DOCK  ·  ~35%</text>
  <text x="90" y="316" font-size="9" fill="#4a5560">agency · ledger · composer · chips</text>

  <!-- ledger rows -->
  <rect x="90" y="330" width="200" height="10" rx="2" fill="#1a1a1a" fill-opacity="0.12"/>
  <rect x="90" y="346" width="160" height="10" rx="2" fill="#1a1a1a" fill-opacity="0.08"/>
  <rect x="320" y="330" width="140" height="28" rx="14" fill="#7a8a4a" fill-opacity="0.45" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="390" y="348" text-anchor="middle" font-size="8" font-weight="600" fill="#1a1a1a">Calibrate Q0</text>
  <rect x="480" y="330" width="180" height="28" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="348" font-size="8" fill="#4a5560">ask the instrument…</text>

  <text x="380" y="404" text-anchor="middle" font-size="8.5" fill="#4a5560">Stage keeps detuning and fidelity in view; dock keeps the agent auditable.</text>
</svg>