<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#eef2f0"/>
  <text x="36" y="36" font-size="11" fill="#1a1a1a" letter-spacing="0.28em" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">PLATE 04  ·  STAGE VS DOCK</text>
  <text x="36" y="56" font-size="9" fill="#4a5560" letter-spacing="0.12em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">PHYSICS IN THE VISUAL FIELD  ·  AGENCY IN THE LEDGER</text>

  <!-- instrument chrome outline -->
  <rect x="60" y="80" width="640" height="300" rx="8" fill="#c5d5d8" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- three-pane stage (top ~2/3) -->
  <rect x="70" y="90" width="620" height="178" rx="4" fill="#5a8fb5" fill-opacity="0.18"/>
  <text x="90" y="112" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.2em">STAGE  ·  THREE PANES  ·  TOP ~2/3</text>
  <text x="90" y="128" font-size="9" fill="#4a5560">physics in the visual field · no tabs</text>

  <!-- left drift -->
  <rect x="82" y="140" width="188" height="116" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="176" y="158" text-anchor="middle" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.12em">LEFT · DRIFT</text>
  <ellipse cx="176" cy="198" rx="62" ry="18" fill="#7a8a4a" fill-opacity="0.28"/>
  <circle cx="158" cy="194" r="6" fill="#3d6a8c"/>
  <circle cx="196" cy="198" r="5" fill="#c41e1e" fill-opacity="0.85"/>
  <text x="176" y="242" text-anchor="middle" font-size="8" fill="#4a5560">applied vs true</text>

  <!-- splitter -->
  <rect x="274" y="150" width="4" height="96" rx="2" fill="#1a1a1a" fill-opacity="0.35"/>

  <!-- center device -->
  <rect x="282" y="140" width="196" height="116" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="380" y="158" text-anchor="middle" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.12em">CENTER · DEVICE 3D</text>
  <circle cx="348" cy="198" r="14" fill="#3d6a8c" fill-opacity="0.75"/>
  <circle cx="412" cy="198" r="14" fill="#7a8a4a" fill-opacity="0.75"/>
  <text x="380" y="242" text-anchor="middle" font-size="8" fill="#4a5560">Q0 · Q1 · readout</text>

  <!-- splitter -->
  <rect x="482" y="150" width="4" height="96" rx="2" fill="#1a1a1a" fill-opacity="0.35"/>

  <!-- right cryostat -->
  <rect x="490" y="140" width="188" height="116" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="584" y="158" text-anchor="middle" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.12em">RIGHT · CRYOSTAT</text>
  <ellipse cx="584" cy="178" rx="22" ry="5" fill="none" stroke="#1a1a1a" stroke-width="0.9"/>
  <ellipse cx="584" cy="198" rx="18" ry="4" fill="none" stroke="#1a1a1a" stroke-width="0.9"/>
  <ellipse cx="584" cy="216" rx="12" ry="3" fill="none" stroke="#1a1a1a" stroke-width="0.9"/>
  <line x1="584" y1="178" x2="584" y2="216" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="584" y="242" text-anchor="middle" font-size="8" fill="#4a5560">plate · status strip</text>

  <!-- dock bottom third -->
  <defs>
    <linearGradient id="blurGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7faf9" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#f7faf9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f7faf9" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="70" y="276" width="620" height="94" rx="4" fill="url(#blurGrad)" stroke="#1a1a1a" stroke-width="1"/>
  <text x="90" y="298" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.2em">DOCK  ·  BOTTOM THIRD</text>
  <text x="90" y="314" font-size="9" fill="#4a5560">transcript · six chips · composer</text>

  <g font-size="6.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">
    <rect x="88" y="326" width="72" height="16" rx="8" fill="#7a8a4a" fill-opacity="0.4" stroke="#1a1a1a" stroke-width="0.7"/><text x="124" y="337">Calibrate Q0</text>
    <rect x="166" y="326" width="58" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.7"/><text x="195" y="337">Bell pair</text>
    <rect x="230" y="326" width="72" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.7"/><text x="266" y="337">Q0 readiness</text>
    <rect x="308" y="326" width="72" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.7"/><text x="344" y="337">Device status</text>
    <rect x="386" y="326" width="72" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.7"/><text x="422" y="337">Improve Bell</text>
    <rect x="464" y="326" width="72" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.7"/><text x="500" y="337">Diagnose Q0</text>
  </g>
  <rect x="548" y="326" width="126" height="16" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="560" y="337" font-size="7" fill="#4a5560">Type a goal…</text>

  <text x="380" y="404" text-anchor="middle" font-size="8.5" fill="#4a5560">Left drift · center device 3D · right cryostat. Dock holds agency under physics.</text>
</svg>