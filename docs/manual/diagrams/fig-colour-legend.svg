<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="160" fill="#fff"/>
  <text x="16" y="22" font-size="10" fill="#475569" letter-spacing="1.2">DIAGRAM COLOUR LEGEND</text>
  <rect x="40" y="50" width="130" height="80" rx="6" fill="#475569"/><text x="105" y="85" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Slate</text><text x="105" y="105" text-anchor="middle" font-size="8" fill="#f8fafc">Control plane</text><rect x="180" y="50" width="130" height="80" rx="6" fill="#007AFF"/><text x="245" y="85" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Blue #007AFF</text><text x="245" y="105" text-anchor="middle" font-size="8" fill="#f8fafc">True</text><rect x="360" y="50" width="130" height="80" rx="6" fill="#FF9500"/><text x="425" y="85" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Orange #FF9500</text><text x="425" y="105" text-anchor="middle" font-size="8" fill="#f8fafc">Applied</text><rect x="540" y="50" width="130" height="80" rx="6" fill="#34C759"/><text x="605" y="85" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Green #34C759</text><text x="605" y="105" text-anchor="middle" font-size="8" fill="#f8fafc">Success</text>
  <text x="40" y="150" font-size="8" fill="#FF3B30">Red #FF3B30 = failure / cancel / chat-only critique</text>
</svg>