<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="280" fill="#f8fafc"/>
  <text x="16" y="22" font-size="10" fill="#475569" letter-spacing="1.2">NOISY SIM - HIDDEN TRUE VS APPLIED</text>
  <line x1="80" y1="220" x2="420" y2="220" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="80" y1="220" x2="80" y2="50" stroke="#0f172a" stroke-width="1.2"/>
  <text x="250" y="250" text-anchor="middle" font-size="9" fill="#475569">time (state reads / poll ticks)</text>
  <text x="40" y="140" text-anchor="middle" font-size="9" fill="#475569" transform="rotate(-90 40 140)">frequency</text>
  <path d="M80 140 C120 120, 150 160, 190 130 S260 100, 300 145 S360 180, 420 110" fill="none" stroke="#007AFF" stroke-width="2.5"/>
  <text x="430" y="114" font-size="10" fill="#007AFF" font-weight="600">true (hidden)</text>
  <path d="M80 160 H160 V155 H240 V148 H320 V130 H420" fill="none" stroke="#FF9500" stroke-width="2.5"/>
  <text x="430" y="134" font-size="10" fill="#FF9500" font-weight="600">applied</text>
  <path d="M190 130 V155 M240 148 V130 M300 145 V130 M360 160 V130" stroke="#FF3B30" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
  <text x="250" y="95" text-anchor="middle" font-size="9" fill="#FF3B30">dfreq = |applied - true|</text>
  <rect x="500" y="60" width="190" height="160" rx="6" fill="#fff" stroke="#e2e8f0"/>
  <text x="515" y="85" font-size="10" fill="#0f172a" font-weight="600">Per-qubit state</text>
  <circle cx="525" cy="110" r="6" fill="#007AFF"/>
  <text x="540" y="114" font-size="9" fill="#475569">_true_params[q]</text>
  <circle cx="525" cy="140" r="6" fill="#FF9500"/>
  <text x="540" y="144" font-size="9" fill="#475569">_applied_params[q]</text>
  <text x="515" y="175" font-size="8" fill="#475569">drift: random walk +</text>
  <text x="515" y="190" font-size="8" fill="#475569">sinusoidal wander</text>
  <text x="515" y="205" font-size="8" fill="#475569">rate ~ 0.002 / step</text>
</svg>