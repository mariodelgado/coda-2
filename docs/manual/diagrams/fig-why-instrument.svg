<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="720" height="300" fill="#fff"/>
  <text x="16" y="22" font-size="10" fill="#475569" letter-spacing="1.2">WHY INSTRUMENT UI BEATS CHAT-ONLY FOR QUANTUM OPS</text>
  <rect x="30" y="45" width="300" height="230" rx="8" fill="#fef2f2" stroke="#FF3B30" stroke-width="1.5"/>
  <text x="180" y="75" text-anchor="middle" font-size="12" fill="#FF3B30" font-weight="600">Chat-only surface</text>
  <text x="50" y="105" font-size="10" fill="#475569">- Serial text; device state is prose</text>
  <text x="50" y="125" font-size="10" fill="#475569">- No continuous drift visibility</text>
  <text x="50" y="145" font-size="10" fill="#475569">- Traces buried in paragraphs</text>
  <text x="50" y="165" font-size="10" fill="#475569">- Metrics not instrument-native</text>
  <text x="50" y="185" font-size="10" fill="#475569">- Easy to miss threshold miss</text>
  <text x="50" y="205" font-size="10" fill="#475569">- No spatial param landscape</text>
  <text x="50" y="240" font-size="9" fill="#FF3B30">Wrong primary surface for ops</text>
  <rect x="390" y="45" width="300" height="230" rx="8" fill="#f0fdf4" stroke="#34C759" stroke-width="1.5"/>
  <text x="540" y="75" text-anchor="middle" font-size="12" fill="#34C759" font-weight="600">Stage + dock instrument</text>
  <text x="410" y="105" font-size="10" fill="#475569">- Stage always shows live drift</text>
  <text x="410" y="125" font-size="10" fill="#475569">- Mono readouts: fid / mK / Df</text>
  <text x="410" y="145" font-size="10" fill="#475569">- Ledger = ToolTrace turns</text>
  <text x="410" y="165" font-size="10" fill="#475569">- Composer is secondary</text>
  <text x="410" y="185" font-size="10" fill="#475569">- Details expand in-rail only</text>
  <text x="410" y="205" font-size="10" fill="#475569">- True/applied markers spatial</text>
  <text x="410" y="240" font-size="9" fill="#34C759">Ops-first - agent-callable</text>
</svg>