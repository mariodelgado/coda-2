<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="860" height="640" fill="#c5d5d8"/>
  <defs>
  <marker id="arr-qm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-qm-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#c41e1e"/>
  </marker>
  <marker id="arr-qm-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#3d6a8c"/>
  </marker>
</defs>
  <text x="28" y="30" font-size="11" fill="#1a1a1a" letter-spacing="0.22em" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">FIG. 1.1  ·  QUBIT MODALITY — SUPERCONDUCTING TRANSMON</text>
  <text x="28" y="50" font-size="8.5" fill="#4a5560" letter-spacing="0.08em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">CALL OUTS BELOW  ·  TRANSMON = JJ + SHUNT CAPACITOR + READOUT</text>

  <!-- chip -->
  <rect x="48" y="72" width="480" height="420" rx="8" fill="#eef2f0" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="64" y="98" font-size="9" font-weight="700" fill="#1a1a1a" letter-spacing="0.16em">CHIP (SIMPLIFIED)</text>

  <!-- readout resonator -->
  <path d="M90 150 L220 150 L220 168 L360 168 L360 150 L470 150"
        fill="none" stroke="#3d6a8c" stroke-width="3.5"/>
  <path d="M90 158 L220 158 L220 176 L360 176 L360 158 L470 158"
        fill="none" stroke="#5a8fb5" stroke-width="1.2" opacity="0.45"/>
  <circle cx="280" cy="130" r="12" fill="#1a1a1a"/><text x="280" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1</text>

  <!-- coupling -->
  <line x1="280" y1="176" x2="280" y2="220" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="300" cy="200" r="12" fill="#1a1a1a"/><text x="300" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text>

  <!-- Transmon island -->
  <rect x="150" y="230" width="260" height="140" rx="6" fill="#5a8fb5" fill-opacity="0.22" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="170" cy="250" r="12" fill="#1a1a1a"/><text x="170" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3</text>

  <!-- shunt capacitor -->
  <rect x="190" y="275" width="80" height="16" rx="1" fill="#7a8a4a" fill-opacity="0.75" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="190" y="305" width="80" height="16" rx="1" fill="#7a8a4a" fill-opacity="0.75" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="230" cy="355" r="12" fill="#1a1a1a"/><text x="230" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4</text>

  <!-- Josephson junction -->
  <g transform="translate(340,298)">
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#1a1a1a" stroke-width="1.6"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#c41e1e" stroke-width="2.2"/>
    <line x1="-11" y1="11" x2="11" y2="-11" stroke="#c41e1e" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#c41e1e" stroke-width="1.4"/>
  </g>
  <circle cx="340" cy="355" r="12" fill="#1a1a1a"/><text x="340" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">5</text>

  <!-- energy levels -->
  <rect x="170" y="390" width="220" height="80" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="190" cy="410" r="12" fill="#1a1a1a"/><text x="190" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">6</text>
  <line x1="230" y1="420" x2="300" y2="420" stroke="#3d6a8c" stroke-width="2.5"/>
  <text x="312" y="424" font-size="10" fill="#1a1a1a">|1&gt;</text>
  <line x1="230" y1="450" x2="300" y2="450" stroke="#7a8a4a" stroke-width="2.5"/>
  <text x="312" y="454" font-size="10" fill="#1a1a1a">|0&gt;</text>
  <line x1="265" y1="420" x2="265" y2="450" stroke="#c41e1e" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- RIGHT: ports as numbered blocks (minimal words) -->
  <rect x="560" y="72" width="260" height="420" rx="8" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="690" y="100" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a" letter-spacing="0.14em">PORTS</text>

  <rect x="580" y="130" width="220" height="70" rx="5" fill="#5a8fb5" fill-opacity="0.28" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="155" r="12" fill="#1a1a1a"/><text x="600" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">7</text>
  <text x="700" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">XY</text>
  <path d="M560 265 L560 165" fill="none" stroke="#3d6a8c" stroke-width="1.4" marker-end="url(#arr-qm-blue)"/>

  <rect x="580" y="230" width="220" height="70" rx="5" fill="#7a8a4a" fill-opacity="0.32" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="255" r="12" fill="#1a1a1a"/><text x="600" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">8</text>
  <text x="700" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">FLUX / Z</text>
  <path d="M560 300 L560 265" fill="none" stroke="#7a8a4a" stroke-width="1.4" marker-end="url(#arr-qm)"/>

  <rect x="580" y="330" width="220" height="70" rx="5" fill="#c5d5d8" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="355" r="12" fill="#1a1a1a"/><text x="600" y="359" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">9</text>
  <text x="700" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">READOUT</text>
  <path d="M470 150 C520 150, 540 360, 580 365" fill="none" stroke="#c41e1e" stroke-width="1.3"
        stroke-dasharray="5 3" marker-end="url(#arr-qm-red)"/>

  <text x="690" y="440" text-anchor="middle" font-size="8" fill="#4a5560">Other modalities differ in physics.</text>
  <text x="690" y="456" text-anchor="middle" font-size="8" fill="#4a5560">Control still uses pulses + readout.</text>

  <rect x="28" y="502" width="804" height="106" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="40" y="520" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.14em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">LEGEND</text>
  <circle cx="40" cy="535" r="8" fill="#1a1a1a"/><text x="40" y="539" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1</text><text x="54" y="538" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Readout resonator (omega_r)</text>
  <circle cx="430" cy="535" r="8" fill="#1a1a1a"/><text x="430" y="539" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text><text x="444" y="538" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Coupling capacitor C_c</text>
  <circle cx="40" cy="551" r="8" fill="#1a1a1a"/><text x="40" y="555" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3</text><text x="54" y="554" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Transmon island</text>
  <circle cx="430" cy="551" r="8" fill="#1a1a1a"/><text x="430" y="555" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4</text><text x="444" y="554" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Shunt capacitor C_s</text>
  <circle cx="40" cy="567" r="8" fill="#1a1a1a"/><text x="40" y="571" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">5</text><text x="54" y="570" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Josephson junction (E_J)</text>
  <circle cx="430" cy="567" r="8" fill="#1a1a1a"/><text x="430" y="571" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">6</text><text x="444" y="570" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Computational levels |0&gt;, |1&gt;</text>
  <circle cx="40" cy="583" r="8" fill="#1a1a1a"/><text x="40" y="587" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">7</text><text x="54" y="586" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">XY microwave drive @ omega_q</text>
  <circle cx="430" cy="583" r="8" fill="#1a1a1a"/><text x="430" y="587" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">8</text><text x="444" y="586" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Flux / Z bias (sets omega_q)</text>
  <circle cx="40" cy="599" r="8" fill="#1a1a1a"/><text x="40" y="603" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">9</text><text x="54" y="602" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Dispersive readout → classical bit</text>

  <text x="430" y="625" text-anchor="middle" font-size="8" fill="#4a5560">Real QPU physics. This product uses a noisy simulator — see FIG. 1.5.</text>
</svg>