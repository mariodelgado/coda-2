<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="860" height="660" fill="#c5d5d8"/>
  <defs>
  <marker id="arr-os" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-os-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#c41e1e"/>
  </marker>
  <marker id="arr-os-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#3d6a8c"/>
  </marker>
</defs>
  <text x="28" y="30" font-size="11" fill="#1a1a1a" letter-spacing="0.22em" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">FIG. 1.5  ·  OUR INTERFACE OVERLAY</text>
  <text x="28" y="50" font-size="8.5" fill="#4a5560" letter-spacing="0.08em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">NL / AGENT → QPUADAPTER → CLASSICAL CONTROL  ·  SIM STANDS IN FOR CRYO + RF</text>

  <text x="48" y="78" font-size="9" font-weight="700" fill="#1a1a1a" letter-spacing="0.12em">REAL STACK + WHERE SOFTWARE SITS</text>

  <!-- NL -->
  <rect x="48" y="96" width="440" height="64" rx="5" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1.3"/>
  <circle cx="72" cy="128" r="12" fill="#1a1a1a"/><text x="72" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1</text>
  <text x="96" y="122" font-size="11" font-weight="700" fill="#1a1a1a">NL GOALS + ORCHESTRATOR</text>
  <text x="96" y="142" font-size="8.5" fill="#4a5560">5 tools · ToolTraces · offline-first planner</text>
  <rect x="400" y="110" width="64" height="36" rx="3" fill="#5a8fb5" fill-opacity="0.5" stroke="#1a1a1a" stroke-width="1"/>
  <text x="432" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a">US</text>

  <!-- classical control / seam -->
  <rect x="48" y="180" width="440" height="110" rx="5" fill="#7a8a4a" fill-opacity="0.32" stroke="#c41e1e" stroke-width="2.2"/>
  <circle cx="72" cy="212" r="12" fill="#1a1a1a"/><text x="72" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text>
  <text x="96" y="208" font-size="11" font-weight="700" fill="#1a1a1a">CLASSICAL CONTROL</text>
  <text x="96" y="228" font-size="8.5" fill="#4a5560">pulse compiler · cal tables · job queue</text>
  <circle cx="72" cy="258" r="12" fill="#1a1a1a"/><text x="72" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3</text>
  <text x="96" y="262" font-size="10" font-weight="700" fill="#c41e1e">QPUADAPTER — 6 METHODS</text>
  <text x="400" y="200" text-anchor="middle" font-size="9" fill="#c41e1e" font-weight="700">SEAM</text>

  <!-- cryo -->
  <rect x="48" y="310" width="440" height="70" rx="5" fill="#5a8fb5" fill-opacity="0.2" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 3"/>
  <circle cx="72" cy="345" r="12" fill="#1a1a1a"/><text x="72" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4</text>
  <text x="96" y="340" font-size="10" font-weight="700" fill="#4a5560">CRYO + RF ELECTRONICS</text>
  <text x="96" y="360" font-size="8.5" fill="#4a5560">AWG · LO · atten · TWPA/HEMT · digitizer</text>
  <rect x="340" y="322" width="128" height="46" rx="4" fill="#3d6a8c" fill-opacity="0.55" stroke="#1a1a1a" stroke-width="1.3"/>
  <circle cx="360" cy="345" r="12" fill="#1a1a1a"/><text x="360" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">5</text>
  <text x="420" y="350" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9">SIM</text>

  <!-- physics -->
  <rect x="48" y="400" width="440" height="56" rx="5" fill="#3d6a8c" fill-opacity="0.25" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 3"/>
  <circle cx="72" cy="428" r="12" fill="#1a1a1a"/><text x="72" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">6</text>
  <text x="96" y="424" font-size="10" font-weight="700" fill="#4a5560">PHYSICS (QUBITS IN MXC)</text>
  <text x="96" y="442" font-size="8.5" fill="#4a5560">toy 1–2 qubit model + drift kernel</text>
  <circle cx="450" cy="428" r="12" fill="#c41e1e" fill-opacity="0.8"/>
  <text x="450" y="432" text-anchor="middle" font-size="9" fill="#f7faf9" font-weight="700">Q</text>

  <!-- right panels — no overlapping CAL LOOP label -->
  <rect x="520" y="96" width="300" height="170" rx="6" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="670" y="124" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a" letter-spacing="0.1em">PRODUCT HONESTY</text>
  <text x="540" y="152" font-size="9" fill="#1a1a1a">Real diagrams show QPU physics.</text>
  <text x="540" y="174" font-size="9" fill="#1a1a1a">This product does not drive a fridge.</text>
  <text x="540" y="196" font-size="9" fill="#4a5560">NoisySimulatorBackend stands in for</text>
  <text x="540" y="214" font-size="9" fill="#4a5560">cryo + electronics + qubits.</text>
  <text x="540" y="242" font-size="9" fill="#c41e1e" font-weight="600">Keep the seam. Replace the stand-in.</text>

  <rect x="520" y="286" width="300" height="120" rx="6" fill="#eef2f0" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="670" y="314" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a1a" letter-spacing="0.1em">INSTRUMENT UI</text>
  <circle cx="540" cy="342" r="12" fill="#1a1a1a"/><text x="540" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">7</text>
  <text x="560" y="346" font-size="9" fill="#4a5560">Stage: drift | device</text>
  <circle cx="540" cy="372" r="12" fill="#1a1a1a"/><text x="540" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">8</text>
  <text x="560" y="376" font-size="9" fill="#4a5560">Dock: agent ledger + composer</text>

  <!-- cal loop arc — label outside right panels -->
  <path d="M488 128 C510 128, 510 428, 488 428" fill="none" stroke="#c41e1e" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arr-os-red)"/>
  <circle cx="510" cy="278" r="12" fill="#1a1a1a"/><text x="510" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">9</text>

  <text x="430" y="490" text-anchor="middle" font-size="9" fill="#1a1a1a">Agents and the UI never reach past the adapter.</text>
  <text x="430" y="510" text-anchor="middle" font-size="9" fill="#4a5560">Closed-loop calibration crosses the red seam on every get/apply.</text>

  <rect x="28" y="522" width="804" height="106" rx="4" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1"/>
  <text x="40" y="540" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.14em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">LEGEND</text>
  <circle cx="40" cy="555" r="8" fill="#1a1a1a"/><text x="40" y="559" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1</text><text x="54" y="558" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">NL goals + orchestrator (product)</text>
  <circle cx="430" cy="555" r="8" fill="#1a1a1a"/><text x="430" y="559" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text><text x="444" y="558" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Classical control box</text>
  <circle cx="40" cy="571" r="8" fill="#1a1a1a"/><text x="40" y="575" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3</text><text x="54" y="574" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">QPUAdapter seam — 6 typed methods</text>
  <circle cx="430" cy="571" r="8" fill="#1a1a1a"/><text x="430" y="575" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4</text><text x="444" y="574" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Cryo + RF electronics (real stack)</text>
  <circle cx="40" cy="587" r="8" fill="#1a1a1a"/><text x="40" y="591" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">5</text><text x="54" y="590" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">NoisySimulatorBackend stand-in</text>
  <circle cx="430" cy="587" r="8" fill="#1a1a1a"/><text x="430" y="591" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">6</text><text x="444" y="590" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Physics / qubits (sim model)</text>
  <circle cx="40" cy="603" r="8" fill="#1a1a1a"/><text x="40" y="607" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">7</text><text x="54" y="606" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Instrument stage (UI)</text>
  <circle cx="430" cy="603" r="8" fill="#1a1a1a"/><text x="430" y="607" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">8</text><text x="444" y="606" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Instrument dock (UI)</text>
  <circle cx="40" cy="619" r="8" fill="#1a1a1a"/><text x="40" y="623" text-anchor="middle" font-size="8" font-weight="700" fill="#f7faf9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">9</text><text x="54" y="622" font-size="8.5" fill="#2a2a2a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Calibration loop across the seam</text>
</svg>