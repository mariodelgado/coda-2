<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#eef2f0"/>
  <defs>
  <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-c-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c41e1e"/>
  </marker>
</defs>
  <text x="36" y="36" font-size="11" fill="#1a1a1a" letter-spacing="0.28em" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">PLATE 02  ·  CALIBRATION LOOP</text>
  <text x="36" y="56" font-size="9" fill="#4a5560" letter-spacing="0.12em" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">MEASURE  →  DECIDE (≥ 0.88?)  →  APPLY  →  REMEASURE</text>

  <!-- central olive ring -->
  <circle cx="380" cy="230" r="148" fill="none" stroke="#7a8a4a" stroke-width="1.2" opacity="0.55"/>
  <circle cx="380" cy="230" r="118" fill="#5a8fb5" fill-opacity="0.12"/>

  <!-- four stations on a square -->
  <g>
    <circle cx="380" cy="100" r="48" fill="#5a8fb5" fill-opacity="0.5" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="380" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.08em">1 MEASURE</text>
    <text x="380" y="112" text-anchor="middle" font-size="8" fill="#2a2a2a">fidelity(q)</text>
  </g>
  <g>
    <circle cx="520" cy="230" r="48" fill="#7a8a4a" fill-opacity="0.5" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="520" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.08em">2 DECIDE</text>
    <text x="520" y="238" text-anchor="middle" font-size="8" fill="#2a2a2a">≥ 0.88?</text>
    <text x="520" y="252" text-anchor="middle" font-size="7.5" fill="#4a5560">or sample</text>
  </g>
  <g>
    <circle cx="380" cy="360" r="48" fill="#3d6a8c" fill-opacity="0.45" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="380" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.08em">3 APPLY</text>
    <text x="380" y="368" text-anchor="middle" font-size="8" fill="#2a2a2a">update params</text>
  </g>
  <g>
    <circle cx="240" cy="230" r="48" fill="#f7faf9" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="240" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a" letter-spacing="0.06em">4 REMEASURE</text>
    <text x="240" y="238" text-anchor="middle" font-size="8" fill="#4a5560">loop / stop</text>
  </g>

  <!-- cycle arrows -->
  <path d="M422 125 Q490 130 488 188" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr-c)"/>
  <path d="M505 272 Q500 330 422 348" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr-c)"/>
  <path d="M338 348 Q270 330 272 272" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr-c)"/>
  <path d="M272 188 Q270 130 338 125" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr-c)"/>

  <!-- success / fail exit -->
  <rect x="600" y="168" width="130" height="124" rx="6" fill="#c5d5d8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="665" y="196" text-anchor="middle" font-size="9" fill="#4a5560" letter-spacing="0.14em">STOP</text>
  <circle cx="640" cy="220" r="6" fill="#7a8a4a"/>
  <text x="654" y="224" font-size="9" fill="#1a1a1a" font-weight="600">success</text>
  <text x="654" y="238" font-size="8" fill="#4a5560">best ≥ 0.88</text>
  <circle cx="640" cy="262" r="6" fill="#c41e1e"/>
  <text x="654" y="266" font-size="9" fill="#1a1a1a" font-weight="600">fail</text>
  <text x="654" y="280" font-size="8" fill="#4a5560">max iters / cap</text>

  <line x1="568" y1="230" x2="598" y2="230" stroke="#c41e1e" stroke-width="1.3" marker-end="url(#arr-c-red)"/>
</svg>