<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" width="612" height="792" role="img" aria-label="AI to QPU technical manual cover — Bloch sphere">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #c5d5d8; }
      .slogan {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.3em;
        fill: #1a1a1a;
        text-anchor: middle;
      }
      .brand {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.24em;
        fill: #1a1a1a;
        text-anchor: middle;
      }
      .subbrand {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 0.34em;
        fill: #2a2a2a;
        text-anchor: middle;
      }
      .qlabel {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 9px;
        font-weight: 500;
        fill: #1a1a1a;
      }
      .qlabel-sm {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 7.5px;
        font-weight: 400;
        letter-spacing: 0.04em;
        fill: #1a1a1a;
      }
      .axis { stroke: #1a1a1a; stroke-width: 0.85; fill: none; }
      .orbit { stroke: #1a1a1a; stroke-width: 0.7; fill: none; }
      .orbit-dash { stroke: #1a1a1a; stroke-width: 0.7; fill: none; stroke-dasharray: 3.2 3.2; }
      .orbit-faint { stroke: #1a1a1a; stroke-width: 0.45; fill: none; opacity: 0.55; }
      .arc { stroke: #1a1a1a; stroke-width: 0.55; fill: none; }
    ]]></style>
    <!-- Soft sphere shading via translucent discs stacked -->
  </defs>

  <rect class="bg" width="612" height="792"/>

  <text class="slogan" x="306" y="76">INTELLIGENCE AT THE QUANTUM SCALE</text>

  <!-- Composition centered -->
  <g transform="translate(306, 378)">

    <!-- Outer control-loop path (ellipse around sphere) — solid + dashed crown -->
    <ellipse class="orbit" cx="0" cy="8" rx="198" ry="248"
             pathLength="100" stroke-dasharray="0" opacity="0"/>
    <!-- Draw as path for dashed upper portion -->
    <path class="orbit" d="M -148,-175
      C -198,-90 -198,40 -148,160
      C -100,230 -40,255 0,255
      C 40,255 100,230 148,160
      C 198,40 198,-90 148,-175"/>
    <path class="orbit-dash" d="M -148,-175
      C -100,-240 -40,-255 0,-255
      C 40,-255 100,-240 148,-175"/>

    <!-- Large translucent Bloch sphere body -->
    <circle cx="0" cy="0" r="148" fill="#5a8fb5" fill-opacity="0.38"/>
    <!-- Soft olive / slate translucent latitude bands (mid-century layered discs) -->
    <ellipse cx="0" cy="-42" rx="118" ry="38" fill="#7a8a4a" fill-opacity="0.18"/>
    <ellipse cx="0" cy="48" rx="122" ry="40" fill="#3d6a8c" fill-opacity="0.20"/>

    <!-- Equator (xy plane) — solid front, dashed back -->
    <ellipse class="orbit" cx="0" cy="0" rx="148" ry="48"/>
    <!-- Meridian (xz, facing) -->
    <ellipse class="orbit-faint" cx="0" cy="0" rx="48" ry="148"/>
    <!-- Tilted meridian suggesting yz / perspective -->
    <ellipse class="orbit-faint" cx="0" cy="0" rx="110" ry="148" transform="rotate(-28)"/>
    <ellipse class="orbit-faint" cx="0" cy="0" rx="110" ry="148" transform="rotate(28)"/>

    <!-- z-axis through poles -->
    <line class="axis" x1="0" y1="-168" x2="0" y2="168"/>
    <!-- small axis caps -->
    <line class="axis" x1="-6" y1="-168" x2="6" y2="-168" stroke-width="0.7"/>
    <line class="axis" x1="-6" y1="168" x2="6" y2="168" stroke-width="0.7"/>

    <!-- |0⟩ north pole, |1⟩ south pole -->
    <circle cx="0" cy="-148" r="3.2" fill="#1a1a1a"/>
    <circle cx="0" cy="148" r="3.2" fill="#1a1a1a"/>
    <text class="qlabel" x="12" y="-152" text-anchor="start">|0⟩</text>
    <text class="qlabel" x="12" y="158" text-anchor="start">|1⟩</text>

    <!-- Origin -->
    <circle cx="0" cy="0" r="2.2" fill="#1a1a1a"/>

    <!-- State vector |ψ⟩ — from origin into upper-right front hemisphere -->
    <!-- Tip at approx θ≈55°, φ≈40° on sphere of r=148 -->
    <!-- Using isometric-ish projection: tip ≈ (78, -72) -->
    <line class="axis" x1="0" y1="0" x2="78" y2="-72" stroke-width="1.35"/>
    <!-- Arrowhead at tip -->
    <path d="M 78,-72 L 68,-68 L 74,-62 Z" fill="#1a1a1a"/>

    <!-- Red measurement / fidelity goal at tip of |ψ⟩ -->
    <circle cx="78" cy="-72" r="5.2" fill="#c41e1e"/>

    <!-- θ arc (polar angle from +z toward |ψ⟩) -->
    <path class="arc" d="M 0,-55 A 55,55 0 0 1 32,-45" opacity="0.85"/>
    <text class="qlabel-sm" x="22" y="-58">θ</text>

    <!-- φ arc (azimuthal, on equator toward projection) -->
    <path class="arc" d="M 42,0 A 42,14 0 0 1 36,8" opacity="0.85"/>
    <text class="qlabel-sm" x="48" y="14">φ</text>

    <!-- |ψ⟩ label near tip -->
    <text class="qlabel" x="92" y="-78" text-anchor="start">|ψ⟩</text>

    <!-- Faint interference / amplitude rings as secondary (subtle, behind vector) -->
    <circle class="orbit-faint" cx="0" cy="0" r="72" opacity="0.35"/>
    <circle class="orbit-faint" cx="0" cy="0" r="100" opacity="0.28"/>

    <!-- Small agent/node on the outer control-loop path (right side) -->
    <g transform="translate(168, -40) rotate(-12)">
      <!-- Node: rounded square with inner dot — agent on closed loop -->
      <rect x="-6" y="-6" width="12" height="12" rx="2.5" fill="#1a1a1a"/>
      <circle cx="0" cy="0" r="2.2" fill="#c5d5d8"/>
      <!-- Tiny closed-loop hint (arc trail) -->
      <path d="M -11,4 Q -14,0 -11,-4" fill="none" stroke="#1a1a1a" stroke-width="0.7" opacity="0.7"/>
    </g>

    <!-- Center motif label (quantum equivalent of "astrodynamics") -->
    <text class="qlabel-sm" x="58" y="62" text-anchor="start">bloch</text>
  </g>

  <text class="brand" x="306" y="718">CODA 2</text>
  <text class="subbrand" x="306" y="742">AI → QPU  ·  TECHNICAL MANUAL</text>
</svg>
