<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" width="612" height="792" role="img" aria-label="AI to QPU technical manual cover">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #c5d5d8; }
      .slogan {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.3em;
        fill: #1a1a1a;
        text-anchor: middle;
      }
      .brand {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.24em;
        fill: #1a1a1a;
        text-anchor: middle;
      }
      .subbrand {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 0.34em;
        fill: #2a2a2a;
        text-anchor: middle;
      }
      .label {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 8.5px;
        font-weight: 400;
        letter-spacing: 0.06em;
        fill: #1a1a1a;
      }
      .orbit { fill: none; stroke: #1a1a1a; stroke-width: 0.75; }
      .orbit-dash { fill: none; stroke: #1a1a1a; stroke-width: 0.75; stroke-dasharray: 3.2 3.2; }
      .orbit-fine { fill: none; stroke: #1a1a1a; stroke-width: 0.4; }
      .axis { stroke: #1a1a1a; stroke-width: 0.65; }
    ]]></style>
  </defs>

  <rect class="bg" width="612" height="792"/>

  <text class="slogan" x="306" y="76">INTELLIGENCE AT THE QUANTUM SCALE</text>

  <g transform="translate(306, 378)">
    <!-- Large translucent mid-blue disc -->
    <circle cx="0" cy="0" r="172" fill="#5a8fb5" fill-opacity="0.40"/>

    <!-- Horizontal bisector -->
    <line class="axis" x1="-172" y1="0" x2="172" y2="0"/>

    <!-- Tall outer orbital ellipse: solid body + dashed crown -->
    <path class="orbit" d="M -98,-198
      C -120,-130 -122,-50 -122,0
      C -122,85 -98,185 -42,245
      C -12,275 12,275 42,245
      C 98,185 122,85 122,0
      C 122,-50 120,-130 98,-198"/>
    <path class="orbit-dash" d="M -98,-198
      C -62,-258 -22,-274 0,-274
      C 22,-274 62,-258 98,-198"/>

    <!-- Nested translucent core ellipses (olive / blue) -->
    <ellipse cx="-16" cy="3" rx="40" ry="23" fill="#7a8a4a" fill-opacity="0.58" transform="rotate(-30)"/>
    <ellipse cx="18" cy="-3" rx="38" ry="21" fill="#3d6a8c" fill-opacity="0.55" transform="rotate(34)"/>
    <ellipse cx="2" cy="1" rx="26" ry="15" fill="#6b8fa8" fill-opacity="0.32" transform="rotate(-6)"/>

    <!-- Bloch / interference orbit nest -->
    <g opacity="0.9">
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(0)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(30)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(60)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(90)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(120)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="54" ry="29" transform="rotate(150)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="70" ry="37" transform="rotate(15)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="70" ry="37" transform="rotate(45)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="70" ry="37" transform="rotate(75)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="70" ry="37" transform="rotate(105)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="70" ry="37" transform="rotate(135)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="86" ry="44" transform="rotate(0)" opacity="0.55"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="86" ry="44" transform="rotate(36)" opacity="0.55"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="86" ry="44" transform="rotate(72)" opacity="0.55"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="24" ry="13" transform="rotate(18)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="24" ry="13" transform="rotate(72)"/>
      <ellipse class="orbit-fine" cx="0" cy="0" rx="24" ry="13" transform="rotate(126)"/>
    </g>

    <!-- Red core: true params / fidelity goal -->
    <circle cx="0" cy="0" r="4.4" fill="#c41e1e"/>

    <!-- Agent glyph riding the outer orbit -->
    <g transform="translate(116, -58) rotate(-20)">
      <path d="M 0,-7.5 L 5.2,0 L 0,7.5 L -5.2,0 Z" fill="#1a1a1a"/>
      <circle cx="0" cy="0" r="1.7" fill="#c5d5d8"/>
      <line x1="-10" y1="2.2" x2="-6.5" y2="1.2" stroke="#1a1a1a" stroke-width="0.65"/>
      <line x1="-13.5" y1="3.8" x2="-10.5" y2="3" stroke="#1a1a1a" stroke-width="0.5" opacity="0.55"/>
    </g>

    <text class="label" x="62" y="50">coherence</text>
  </g>

  <text class="brand" x="306" y="718">AI → QPU</text>
  <text class="subbrand" x="306" y="742">INTEGRATION LAYER  ·  TECHNICAL MANUAL</text>
</svg>
