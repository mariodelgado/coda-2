[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-qpu"
version = "0.1.0"
description = "AI-to-QPU integration layer: agent-friendly control plane for quantum hardware calibration and operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Conductor Quantum"}
]
keywords = ["quantum", "qpu", "calibration", "agents", "control-plane"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "streamlit>=1.28.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
llm = [
    "openai>=1.3.0",
]

[project.scripts]
conductor-qpu-api = "conductor_qpu.api:run"
conductor-qpu-ui = "conductor_qpu.ui:run"

[project.urls]
Homepage = "https://github.com/conductor-quantum/conductor-qpu"
Repository = "https://github.com/conductor-quantum/conductor-qpu"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor_qpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
